name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check version matches the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          assert project['name'] == 'instagram-edits-sdk'
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          PY
      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -v
      - run: python examples/offline_demo.py
      - run: python tools/generate_docs.py --check
      - run: python tools/generate_openapi.py --check
      - run: python tools/check_release.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the actual wheel without runtime dependencies
        run: |
          python -m venv /tmp/edits-wheel-check
          /tmp/edits-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/edits-wheel-check/bin/python -m unittest discover -s tests -v
          /tmp/edits-wheel-check/bin/python examples/offline_demo.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/instagram-edits-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish the verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
